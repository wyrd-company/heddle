# ---
# relationships:
#   verifies: blueprint-authoring
# ---
# Stage contract used by the recipe process.
id: stage-write
kind: stage
outputs:
  result:
    type: object
    properties:
      overridden: { type: boolean }
      turnEnded: { type: boolean }
      title: { type: string }
      ingredients: { type: array, items: { type: string } }
      steps: { type: array, items: { type: string } }
nodes:
  prepare:
    uses: pass
    params:
      prompt: prompts/draft.md
      handoff: contracts/draft.yml
  complete:
    uses: terminal-result
    params:
      value: { from: prepare.payload }
  interrupted:
    uses: terminal-result
    params:
      value: { from: prepare }
edges:
  - from: prepare
    to: complete
    when: result.output.handoff
  - from: prepare
    to: interrupted
    when: result.output.overridden or result.output.turnEnded
