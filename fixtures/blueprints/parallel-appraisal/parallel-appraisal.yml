# This unanticipated helper asks two roles at once before joining their answers.
id: parallel-appraisal
kind: helper
description: Collect independent appraisals of a museum object in parallel.
outputs:
  result:
    type: object
nodes:
  # The operator records the object's visible condition.
  inspect-condition:
    uses: question
    params:
      role: operator
      questions:
        - id: condition
          header: Condition
          question: prompts/condition.md
          options:
            - label: stable
              description: No immediate treatment is needed.
            - label: fragile
              description: Handling should stop until treatment is planned.
  # The adjudicator separately assesses the object's documented history.
  inspect-history:
    uses: question
    params:
      role: adjudicator
      questions:
        - id: history
          header: History
          question: prompts/history.md
          options:
            - label: sufficient
              description: The recorded history supports appraisal.
            - label: incomplete
              description: More history is needed before appraisal.
  # Named branch results are combined after both answers arrive.
  combine-panel:
    uses: aggregate
    config:
      joinStrategy: all
    params:
      bindings:
        condition: { node: inspect-condition, path: payload }
        history: { node: inspect-history, path: payload }
  complete:
    uses: terminal-result
    params:
      value: { from: "`combine-panel`" }
edges:
  - from: inspect-condition
    to: combine-panel
  - from: inspect-history
    to: combine-panel
  - from: combine-panel
    to: complete
