# Unmatched work waits for the expected issue type, retries intake, then notifies.
id: hold-then-attention
kind: helper
description: Hold unmatched work until its type changes or operator attention is needed.
inputs:
  issue: { type: object }
  expectedType: { type: string }
outputs:
  result: { type: object }
nodes:
  wait-for-type:
    uses: on-issue-change
    params:
      when: type = $expectedtype
      bindings:
        expectedtype: expectedType
      deadline: PT24H
  retry-intake:
    uses: child-run
    params:
      blueprint: default-intake
      inputs:
        issue: { from: "`wait-for-type`.payload" }
  notify-attention:
    uses: notify
    params:
      channel: pushover
      title: { inline: "Issue intake needs attention" }
      message: { inline: "Issue type {{ expectedType }} is still required." }
  retried:
    uses: terminal-result
    params:
      value: { status: retried }
  retry-failed:
    uses: terminal-result
    params:
      value: { status: failed, details: { from: "`retry-intake`.payload" } }
  notified:
    uses: terminal-result
    params:
      value: { status: attention }
edges:
  - from: wait-for-type
    to: retry-intake
    when: result.output.changed
  - from: wait-for-type
    to: notify-attention
    when: result.output.timeout
  - from: retry-intake
    to: retried
    when: result.output.completed
  - from: retry-intake
    to: retry-failed
    when: result.output.failed
  - from: notify-attention
    to: notified
