id: unhandled-pass-result
kind: stage
nodes:
  first:
    uses: pass
    params:
      prompt: { inline: "Complete the request." }
      handoff:
        type: object
        description: Submit the result.
        properties: {}
  done:
    uses: notify
    params:
      channel: pushover
      title: { inline: "Complete" }
edges:
  - from: first
    to: done
    when: result.output.handoff
