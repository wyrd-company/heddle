$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - engine-and-run-model
    - node-types
    - blueprint-authoring
objective: >
  Make a GitHub Project the place where work exists, keep it in step with
  every run, and choose each issue's lifecycle blueprint without configuring
  anything a blueprint or the issue itself can say. Require only GitHub
  Projects and T3 Code of a user; infer the rest with guard rails.
background:
  current-design: >
    Work lives on a local kanban board that a service reads and writes. The
    board's statuses and the service's stages are configured separately and
    drift. Cross-repository epics and shared boards are awkward.
  problems:
    - Two definitions of a stage, one in the process and one on the board, with no single source of truth.
    - Configuration that names repositories, projects, and blueprint choices per task, when the issue already carries that information.
    - Preferences such as one project per repository or labels versus fields baked into code.
design-challenges:
  single-source-of-truth-for-stages: >
    A blueprint's stages and the project's Status options must agree, and
    only one of them may be authoritative.
  choosing-a-blueprint-per-issue: >
    Different issues follow different processes. The rule that chooses must
    be the user's, must be able to read anything on the issue, and must not
    be a configuration file.
  inference-without-guessing: >
    Project, repositories, workspace roots, and blueprint can all be inferred
    from an issue. Each inference needs a guard rail that asks or refuses
    instead of guessing when the answer is ambiguous.
  shared-projects: >
    Two epics with different blueprints may share one project. Reconciliation
    must handle the union without one blueprint deleting another's stages.
  event-delivery: >
    Webhooks are the supported path. Not every host can receive them, so
    polling must produce the same events.
proposed-design:
  high-level-overview: >
    A service instance binds one or more GitHub Projects. Every issue in a
    bound project is a workflow instance from the moment it is discovered.
    A shipped, replaceable intake blueprint reads the issue and starts its
    lifecycle run. Stages declared by bound blueprints are reconciled into
    each project's Status field through `@wyrd-company/github-work`, with
    the blueprint as the source of truth. Issue and card changes arrive as
    webhook deliveries or poll diffs and become resumes on waiting runs.
  binding: >
    Service configuration names the bound projects, the GitHub credential,
    the T3 Code endpoint, and the blueprint repository location. Nothing
    else. Repositories are not configured; they are discovered from issues.
    Bob's preferences are not encoded anywhere in the service.
  the-issue-as-input: |
    Every run's initial context includes `issue`:

    - identity: repository, number, node id, url
    - content: title, body, type, labels, assignees, milestone, state
    - organization fields and their values
    - project card fields and their values for the bound project
    - relationships: parent, sub-issues, blocked-by, blocking, duplicates,
      linked pull requests

    Conditions, prompt templates, `policy` rules, the epic task-graph
    builder, and reconciliation read this one shape. The `github` brick
    writes back to it. Blueprints declare the fields they need under
    `requires.issue`, and reconciliation conforms the project so those fields
    exist; lint refuses a blueprint whose needs cannot be met.
  discovery-and-intake: >
    A new item in a bound project creates an instance whose first run is the
    intake blueprint. Intake reads `issue` and routes on whatever the author
    chose: issue type, an organization field, a project field, the parent
    epic's blueprint, or a mix. Its terminal nodes are `start-lifecycle`
    nodes naming a blueprint id. The shipped default routes on issue type.
    Whether the lifecycle blueprint can also be pinned by a person through a
    project field is a choice the intake author makes by reading that field
    first.
  unmatched-intake: >
    An issue that matches no rule enters the shipped `hold-then-attention`
    blueprint: wait on `on-issue-change` with a deadline, re-run intake on
    change, and raise attention through `notify` or `question` when the
    deadline passes. Users replace it like any blueprint.
  inference-guard-rails: |
    - Project: from the issue's project memberships. If it is in more than
      one bound project, ask once through `question` and record the answer
      on the card.
    - Repositories: the issue's repository, its sub-issues' repositories, and
      linked pull requests' repositories.
    - Workspace roots: local clones whose remote matches, found by scanning
      configured workspace directories. A stage for a repository with no
      clone refuses to start and raises attention.
    - Blueprint: intake, as above.
  reconciliation: >
    Each bound blueprint declares its stages: the nodes an author marks with
    `stage: true`, or every `child-run` of a stage blueprint by default. For
    each project, the union of stages across the blueprints intake can route
    to becomes the Status field's options, in blueprint order, appended
    never deleted. Reconciliation runs at service start, on blueprint
    repository change, and before an instance starts. It uses the package's
    `ensure` with a project schema derived from the blueprints and the
    `requires.issue` declarations. Drift the package reports but will not fix
    is raised as attention.
  status-projection: >
    When a run enters a stage node, the engine sets the card's Status to that
    stage's option. The blueprint author does not write this; it is an
    invariant. A blueprint may additionally map other node results to other
    fields through the `github` brick.
  epics: >
    An epic is any issue whose intake chose an epic blueprint. The shipped
    epic blueprint builds a task graph from the epic's sub-issues and their
    blocked-by links: one `child-run` of the task lifecycle per sub-issue,
    edges from blocked-by, fan-out for independent tasks, `all` joins where
    they converge. The graph is regenerated from the issues each time the
    graph node runs, so re-planning is editing issues. The epic blueprint's
    other nodes, planning, UAT pull requests, retrospective, are ordinary
    authored nodes.
  event-delivery: >
    The service exposes a webhook handler for GitHub `issues`,
    `projects_v2_item`, `issue_comment`, and `pull_request` events, verified
    by the webhook secret. How deliveries reach it is the host's concern. A
    poller with the same output contract runs when no webhook is configured
    or as a safety net at a low rate. Both feed one intake that diffs the
    issue snapshot, updates the stored copy, and resumes runs waiting on
    `on-issue-change` whose condition matches.
  service-as-single-writer: >
    The service is the only writer of Status. Agents and people may change
    any other field, and those changes are events the blueprint can route
    on. A person moving Status by hand is also an event, and the shipped
    lifecycle blueprint treats it as an operator override that resumes the
    current stage with result `overridden`.
