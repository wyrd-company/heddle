$schema: https://refinery.systems/ontology/technical-design
relationships:
  references:
    - flowcraft-gate
    - t3-headless
    - t3-session-visibility
objective: >
  Heddle is a workflow service that runs software tasks through their
  delivery lifecycle. Deterministic machinery performs every mechanical
  step and state transition; language-model agents are started only at
  the points that require judgment, each in a short, focused session.
  A human operator supervises through a live visual console and is
  engaged only when a decision requires them.
proposed-design:
  high-level-overview: >
    Heddle runs one workflow instance per task. A lifecycle blueprint —
    a declarative, versioned graph of stages — defines how instances of
    a given task type move from start to done. An epic-level reconciler
    continuously compares the kanban board against running instances and
    starts, escalates, or completes work so the set of instances always
    matches the set of ready tasks. Agent sessions execute on T3 Code
    over its HTTP dispatch API, one session per judgment stage, each
    bootstrapped from a deterministically assembled handoff. Agents
    report outcomes back through Heddle's MCP tools, which advance the
    instance. A vendored tldraw canvas renders every instance live from
    the persisted event log, and the same canvas hosts the operator's
    attention queue. All instance state persists in SQLite on a bind
    mount, so instances survive process restarts and container rebuilds.
  task-lifecycles: >
    A lifecycle is a flowcraft blueprint: a serializable JSON graph of
    nodes and edges interpreted by the flowcraft runtime. Judgment
    stages are wait nodes; an instance parked at a wait node costs
    nothing and persists indefinitely. Resumes route through condition
    edges keyed on the disposition supplied by the resuming caller
    (for review: approve, reject, escalate), and cycle re-entry nodes
    declare `joinStrategy: any` so loops such as review → remediate →
    review traverse repeatedly. After every resume, Heddle asserts that
    the instance landed in an expected state and raises attention when
    it did not. Node execution is at-least-once, so every node effect
    is idempotent.

    Each task names its lifecycle: a `lifecycle` property on the
    task — front matter where the board stores it, a `lifecycle:`
    tag otherwise — selects the blueprint by artifact ID, set when
    the task is authored. The reconciler starts no instance for a
    task without one; it raises attention instead of guessing.
    The standard delivery lifecycle
    is implement → review → remediate loop → merge → retrospective →
    finalize; other lifecycles are shorter or different blueprints
    (a trivial lifecycle omits retrospective). Blueprints are schema'd
    artifacts in this repository. An instance records the git blob hash
    of the blueprint it started from and runs that version to
    completion. The operator can rebase a running instance onto a newer
    blueprint version at a named state; the rebase validates that the
    target state exists and raises attention when it does not.
  epic-reconciliation: >
    The reconciler is a control loop over the kanban board. Each pass
    it computes the delta between board state and instance state and
    acts on it: a ready task with satisfied dependencies and no
    instance gets one started; an instance past its stage's staleness
    threshold raises attention; when every non-UAT child of an epic is
    done, the epic's UAT stage opens. Task dependency edges gate
    readiness, so the epic's dependency graph is an input to
    scheduling, not only a view.

    The epic task's own status is the operator's control lever. Moving
    an epic to `in-progress` starts it: the reconciler promotes the
    epic's children from `backlog` to `todo` — including children
    added later — and dispatches them as readiness allows, with
    sequencing carried by dependency edges. Moving an epic out of
    `in-progress` pauses it: no new dispatches for its children, while
    in-flight instances run to their next wait state and hold. The
    reconciler advances the epic itself to `uat` when its last non-UAT
    child completes and to `done` when UAT is accepted.

    Heddle is the single writer of child-task status on the board:
    instance state mirrors to the task's column, and nothing else
    moves those cards.
    Agents create follow-up tasks and findings through MCP tools;
    Heddle applies the writes, so new child tasks are visible to the
    reconciler the moment they exist. The reconciler also enforces
    pacing gates through one shared evaluator. Workspace configuration
    declares a default provider, a total active-session limit, provider
    budgets over fixed five-hour usage windows, and subagent fan-out and
    nesting-depth limits. A provider usage source supplies observations
    without coupling the evaluator to one provider mechanism. Lifecycle
    and subagent sessions draw from the same active-session and provider
    budgets.

    A denied dispatch does not cancel or fail work. The task remains
    ready, and its instance state records a structured deferral with the
    applicable limit, observed usage or occupancy, and the next provider
    window time when one applies. An unchanged deferral converges without
    another write. Each reconciliation pass evaluates deferred work
    again, so released capacity starts it on a later pass.

    One production composition owns reconciliation for a workspace. It
    constructs the real board adapter, SQLite-backed instance controller,
    lifecycle resolver and engine, session bootstrap, observation channel,
    durable attention queue, Pushover notifier, pacing evaluator, and stage
    thresholds. A serialized scheduler coalesces ticks while one pass runs;
    start performs an immediate pass and stop cancels its timer and drains the
    current pass within a configured bound. Runtime scheduling and adapter
    completion records persist intent and replay position only. Lifecycle,
    pacing, attention meaning, escalation identity, and session liveness remain
    authoritative in their existing components.
  agent-sessions: >
    Sessions run on T3 Code, driven headlessly over plain HTTP:
    `POST /api/orchestration/dispatch` carries every command, and
    bearer tokens come from T3's pairing and RFC 8693 token exchange.
    Heddle prepares each session itself: it creates the git worktree
    under `/workspaces/worktrees/{repository}/{worktree}`, creates the
    thread, and sends a bare `thread.turn.start` — three deterministic
    steps it owns end to end. Provider, model, and runtime mode are
    per-stage configuration; Heddle pins runtime modes known to work
    with each driver and CLI version and verifies them as dispatch
    preconditions. Mid-turn steering is a second `thread.turn.start`
    on the same thread.

    Every production thread uses the configured existing workspace
    `projectId`. Its bounded deterministic title contains the Heddle marker,
    complete task identity, and a stable stage discriminator. First-turn
    dispatch omits `titleSeed`, so T3 cannot replace the Heddle title from a
    prompt-derived seed.

    Sessions are short and stage-scoped. Nothing carries between
    stages except the handoff: a deterministically assembled bootstrap
    containing the task contract, the outputs of prior stages (a
    remediation session receives the review's findings, never the
    review session's transcript), the stage's instantiated todo list,
    and a pointer to the stage's skill. Because the handoff is data on
    the instance, retrying a stage cold means replaying the same
    bootstrap into a fresh session.
  workflow-mcp: >
    Heddle exposes its actions to agents as a stateless
    streamable-HTTP MCP server, the one integration surface every
    agent harness supports through ordinary configuration. The tool
    suite includes `advance` (disposition the current stage),
    `get_task_context`, `report_blocked`, `escalate` (raise a
    blocking question), follow-up and finding creation, and a todo
    suite (list, check, add) that replaces each harness's built-in
    todo tools, which are disabled per harness. The tool list is
    per-session: computed at bootstrap from the task and its stage's
    blueprint declaration, and tools a task type does not use are
    omitted rather than offered and denied. Because sessions are
    stage-scoped, the list holds static for a session's life and no
    harness needs dynamic tool updates. `advance` presents only the dispositions valid for
    the instance's current state, generated from the blueprint's
    outgoing edges with per-disposition descriptions — the tool schema
    itself guides the agent to a legal transition. Every session's
    bootstrap carries a correlation token minted by the reconciler,
    binding the session to its instance so a caller can advance only
    its own work, and `advance` is idempotent per instance and stage,
    so a retried call cannot double-transition.

    Todo lists are instantiated from templates. A todo template is a
    schema'd artifact in this repository: the checklist for one stage
    of one task type, with placeholders for task context. Each
    blueprint stage that starts an agent session names its template;
    at bootstrap, Heddle fills the template from the task contract
    and stores the resulting list on the instance. The instantiated
    list belongs to the stage's agent, which can add, edit, and
    reorder items; the template itself never changes. The todo tools
    read and write that stored list, so progress persists across
    session retries and appears in the console. Each activation list
    remains on the instance as history. A handoff carries its current
    activation list and prior lists whose activations own valid stored
    handoffs; all other historical lists are excluded.
  subagents: >
    Delegation is a Heddle capability rather than a harness feature.
    The MCP suite includes subagent tools: spawn starts an
    asynchronous child T3 session, prepared the same way as a stage
    session and configured with any provider and model, so a parent
    on one harness delegates to models its harness does not support.
    Spawn assigns the child a todo subtree — a node and its children
    — and mints a correlation token scoped to that assignment, so the
    child's writes land only inside its subtree. A node has one
    active assignee, so two agents never race on the same work.
    Todo items carry optional parent links that form an acyclic durable
    tree. The parent list owns each assignment as one compare-and-swap
    record containing the subtree root, correlation token, child session
    and thread identity, parent identity, provider, model, and nesting
    depth. Authorization resolves ancestry from that stored tree and
    fails closed for missing, cyclic, foreign, inactive, or overlapping
    nodes. Assignment and correlation-token publication are one state
    replacement. SQLite maintains a global unique correlation-token catalog
    in the same transaction as every instance-state replacement and rebuilds
    it from event history on recovery; duplicate history fails recovery.
    Agent-facing todo and handoff projections omit the assignment catalog,
    so bearer tokens and assignment metadata remain inside the authorization
    boundary.

    The shared todo list is the progress channel: the parent reads
    the child's subtree to check progress, and a liveness tool
    answers whether the child's session is still running,
    distinguishing working from crashed. When the child session
    stops, Heddle detects it through the same shell polling that
    observes stage sessions and notifies the parent by steering a
    message into its thread over the T3 API. Fan-out and nesting
    depth are dispatch preconditions alongside the reconciler's
    other pacing gates, so delegation draws from the same capacity
    budget as all other sessions.
    The observation loop records a stopped assignment and a deterministic
    parent-steer intent before it dispatches the steering turn. Replay uses
    the same command identity, message identity, terminal phase, and exact
    message payload, and completion is recorded on the canonical assignment.
    Stopping an assignment atomically stops every active assignment descendant
    in deterministic assignment order. Active authorization requires an
    unbroken active lineage, so an inactive ancestor cannot leave an orphaned
    writer. A concurrent descendant observation that loses its teardown claim
    to an ancestor recognizes the stored ancestor stop and returns without a
    second steer. The subagent service supplies this hook to the session observer;
    it does not poll T3 or decide liveness separately.

    Escalation is a blocking question through the MCP suite's
    `escalate` tool: structured questions with options, the call
    held open until answered, the answer returned as the tool
    result. Heddle routes by parentage: a subagent's escalation is
    steered to its parent, which answers through an answer tool
    scoped by correlation token to its own children; a top-level
    session's escalation enters the attention queue with a pushover
    notification, and the operator answers from the console.
    Session preparation configures the Heddle MCP server for these
    long-held calls: Codex receives `tool_timeout_sec = 100000`, and
    Claude Code receives `MCP_TOOL_TIMEOUT=100000000` milliseconds. A
    provider-specific launch-preparation port applies the setting before
    Heddle creates the T3 thread; Codex and Claude session creation fails
    closed when that consumer is absent.
    Escalation opening and session disposition share the durable instance
    claim boundary: opening atomically advances the instance version with
    its event, while advance claims disposition authority only when neither
    the session nor a child awaiting its answer has a pending escalation.
    Once disposition is claimed, new escalations owned by that session or
    routed to it fail closed. Concurrent open and advance operations therefore
    produce one valid winner instead of a stopped session with a pending call.
    Because escalation rides Heddle's MCP surface, it is uniform
    across providers and independent of any harness's question
    tool.

    Top-level routing composes one durable attention adapter and one Pushover
    adapter. Both consume the escalation's stable attention ID. Adapter
    completion is durable, so a process that stops after an effect succeeds but
    before its route event is appended can replay the route without duplicating
    the attention entry or notification delivery. The escalation remains
    pending and answerable until the accepted answer event is recorded.

    Harness-native question tools serve assistive tasks, where the
    operator already works in T3's UI. The provider adapters map
    those tools to pending-user-input state on the thread shell,
    answerable from the UI or over the dispatch API, and resolution
    is an event in thread history, so every watching client clears
    the prompt regardless of who answered. Assistive task types run
    only on harnesses that provide a question tool, verified as a
    dispatch precondition, and Heddle dispositions any pending
    question before stopping a session, because a stop settles
    pending questions with empty answers.
  observation: >
    Two channels report on running work, split by who holds the truth.
    Semantic outcomes — the verdict of a review, the completion of an
    implementation — come from agents through `advance`. Liveness comes
    from polling T3's `GET /api/orchestration/shell` snapshot and
    deriving each thread's phase (running, completed, waiting for
    approval, failed) with the same derivation T3's own clients use.
    A session that ends, fails, or stalls without advancing is a
    designed-for transition: after its threshold, the instance moves
    to an attention state and notifies the operator. Pending T3
    approvals and user-input requests surface through the same poll
    into the attention queue with actions that answer the recorded T3
    request. A user-input attention record carries the exact typed question
    catalog from the T3 request activity; consumers do not reconstruct
    prompts, options, or answer cardinality from thread messages or shell
    flags. Heddle dispositions every pending approval and user-input
    request before stopping a session, because stop settles unanswered
    questions with empty answers. Interrupt, question-disposition, stop,
    and archive commands use replayable event-before-effect records;
    intent is durable before dispatch and a completed effect is not
    dispatched again.

    Every stage thread remains in T3's normal shell while its recorded
    lifecycle stage is active or operator participation remains. T3
    completion never authorizes a semantic transition or cleanup. Heddle
    dispatches `thread.archive` only when the stage's recorded `advance`
    operation is complete, the T3 thread has no foreground or background
    liveness, and no queued turn, actionable proposed plan, approval,
    user-input request, Heddle escalation, or canonical child conversational
    handoff remains. Queued-turn evidence is a latest user-message timestamp
    newer than every recorded timestamp on the latest turn; unmatched or
    malformed evidence fails closed. The recorded `threadId` and archive facts
    make this cleanup idempotent. Heddle does not snooze, settle, pin, or
    reorder active or operator-blocked work.

    The production scheduler invokes this observer for each persisted active
    session after reconciliation. Observation thresholds and reconciler stage
    thresholds come from the workspace configuration and survive restart.
  mechanical-nodes: >
    Every step with a single correct outcome executes as a
    deterministic blueprint node running real code: creating the
    worktree and branch, taking the gitpr review snapshot, merging to
    the epic branch on approval, deleting merged branches and
    worktrees, mirroring board status, and filing records. The merge
    node enforces the review contract mechanically: snapshots are
    immutable and verdicts binary, an approved snapshot merges from
    its exact head without a merge commit, and any drift between
    snapshot and branch head routes the instance back to remediation.
    A mechanical node that cannot complete — a merge conflict, a dirty
    worktree — moves the instance to attention rather than retrying an
    agent into the failure.
  human-console: >
    The console presents three views of the same state, at three
    altitudes. A kanban projection answers where everything stands:
    columns come from the board, and each in-progress card is
    enriched with its instance's current lifecycle stage and dwell
    time — detail the board file alone cannot carry. A dependency
    graph answers why work is or is not moving: task edges rendered
    with each node's status, so a blocked chain reads at a glance.
    The lifecycle canvas answers what exactly is happening inside one
    instance. Selecting a card or graph node opens that task's
    canvas. Both projections are read-only renderings of board and
    instance state; the one board write the console offers is the
    epic status lever, because dragging child cards would contend
    with the reconciler as their single writer. Task authoring and
    editing remain in kanban-md.

    A workspace can host several epics and standalone tasks at once,
    so every view carries a scope filter: all work, one epic (its
    children and its own lifecycle), or one task. The filter is part
    of the console URL, so a pushover deep link lands already scoped
    to the entry that raised it.

    The lifecycle view consumes one canonical read model assembled
    outside the viewer. It identifies the persisted instance and its
    pinned blueprint blob and carries the raw flowcraft events grouped
    in recorded execution order behind one monotonic cursor. An initial
    read replays the complete persisted history; later reads contain
    only a contiguous tail. The view fails closed on cursor gaps,
    overlaps, instance or blueprint identity drift, and events that name
    nodes outside the pinned blueprint. It renders the current stage,
    repeated node traversals, and the same ordered events in an adjacent
    history panel without becoming an authority for blueprint or event
    state. Deployments without a composed lifecycle reader return an
    unavailable response instead of substituting partial state.

    An attention queue overlays every view and lists each instance
    awaiting a human: adjudications, escalations, stale work, UAT,
    and pending T3 approvals. Each entry offers the dispositions
    valid for its state, and the buttons call the same actions the
    MCP tools call — humans and agents disposition through one
    contract. Each projected entry has a stable identity, an explicit
    authority and target for every offered action, and a deterministic
    fingerprint of its current state and actions. The action endpoint
    re-reads the canonical unresolved entry and accepts only the offered
    action and matching fingerprint before it delegates through an injected
    action port. A deployment without that port fails closed for actionable
    entries; informational attention has no invented disposition. Pushover
    notifications preserve scope and deep-link focus to the stable entry. The
    operator can equally disposition conversationally: any agent
    session configured with Heddle's MCP server can act on their
    behalf. T3's own UI remains the surface for conversational
    participation in live sessions.
  viewer: >
    The canvas is built from the vendored `@flowcraft/tldraw`
    primitives — `EventBus`, `useExecutionBridge`, `FlowcraftSync`,
    `blueprintToCanvas` — fed by Heddle's event stream rather than an
    in-tab runtime. Replaying an instance's persisted event log
    renders its exact history; tailing the log renders it live. The
    console serves its generated React and tldraw bundle from the
    installed package and does not depend on a workspace-only
    `@flowcraft/tldraw` registry package. The console canvas is
    read-only and hides editing controls. Its content security policy
    keeps scripts and style elements self-hosted; tldraw's generated
    geometry requires inline style attributes, while object content,
    base remapping, and framing remain denied.
    same components edit blueprints: canvas changes round-trip to the
    blueprint JSON, so the diagram the operator edits is the artifact
    the interpreter runs.
  persistence-and-recovery: >
    Instance state (serialized flowcraft context, handoffs, todo
    state, correlation tokens) and the append-only event history live
    in SQLite on a workspace bind mount. Advancing an instance loads
    its context, resumes, asserts the post-state, and persists — each
    step is an ordinary process invocation, so the service holds no
    instance state in memory that matters. After a crash or container
    rebuild, startup replays event history to reconstruct instances,
    and the reconciler compares recovered instances against live T3
    threads: a stage whose session no longer exists is retried cold by
    replaying its bootstrap.

    The same database stores canonical scheduling intent, durable attention
    entries, and stable-ID adapter completion. These records make instance
    start, session activation, attention routing, and notification replay
    idempotent without introducing another lifecycle or attention authority.
  deployment: >
    Heddle installs as a devcontainer feature in each workspace
    container, following the t3code-server pattern: an s6-supervised
    service, a caddy route with a workspace DNS name serving the
    console and the MCP endpoint, and its state directory bind-mounted
    from a workspace-specific host path so state outlives rebuilds.
    One Heddle instance serves one workspace — its board, its
    worktrees, its T3 server — and each workspace container is a
    complete, self-contained installation.

    The deployment server accepts the canonical production composition and
    shares its board, persistence, console state, MCP handler, scheduler, and
    shutdown lifetime. Supplying separate board or console authorities with a
    production composition is rejected.
