$schema: https://refinery.systems/ontology/technical-design
relationships:
  related-to:
    - engine-and-run-model
    - node-types
    - github-binding-and-intake
objective: >
  Let a person or an agent author blueprints as YAML in a git repository,
  with comments that survive every tool that touches the file, validated
  before they run, and drawable later without a second source of truth.
background:
  current-design: >
    Blueprints are JSON artifacts validated by a schema and an interpreter.
    JSON has no comments, and an author's reasoning lives in commit messages
    or nowhere.
  problems:
    - JSON blueprints cannot carry the why beside the what.
    - A visual editor that regenerates the file from the engine's model erases hand-written structure and comments.
    - Authoring is complex enough that people and agents both need help, and help needs a stable reference.
design-challenges:
  non-lossy-translation: >
    The engine runs Flowcraft JSON. The file is YAML with comments. Every
    load and every save must round-trip without losing comments, key order,
    or formatting an author chose.
  two-kinds-of-blueprint: >
    Plumbing blueprints (shipped stage blueprints, answer-question,
    hold-then-attention, the default intake) ship with Heddle and change on its schedule. Process blueprints
    belong to the user and change on theirs. Both use one format and one
    registry, and a user may fork a shipped one.
  validation-before-harm: >
    A blueprint that cannot work must fail when it is written or loaded,
    with a reason, before any project or thread is touched.
proposed-design:
  high-level-overview: >
    A blueprint repository is a git repository the service reads. Each
    blueprint is one YAML file. The loader parses YAML into a document model
    that preserves comments, derives a Flowcraft blueprint from it, lints
    the result with Flowcraft's linter plus Heddle's rules, and caches the
    JSON by commit. Writers, whether an agent tool, a console editor,
    or a future canvas, edit the YAML document model and serialize it, never
    the JSON.
  translation: >
    The `yaml` package's document API holds comments and formatting. Loading
    produces the document and a plain object; the plain object becomes the
    Flowcraft blueprint. Saving applies edits to the document and serializes
    it, so untouched lines are byte-identical. A round-trip test on every
    fixture asserts that load then save changes nothing.
  edge-conditions: >
    Edge `when` expressions are JSONata, evaluated over `result` and the run
    context. Action edges are not
    written and are rejected. A pausing node's results are booleans under
    `result.output`, so the common condition is one path, and anything in
    the payload or the context is available for the uncommon one.
  validation: >
    One check chain, run by the service on load and by the `validate`
    command offline: YAML parse, the blueprint specification's schema,
    every referenced template, schema, and rules file, JSONata syntax of
    every `when`, handoff schema validity and MCP tool constraints,
    Flowcraft's linter, Heddle's lint rules from the node-types design, and
    the load-then-save round-trip. None of it needs credentials or a
    running service. The one live check, `requires.issue` against the bound
    project, is a separate flag. Failures name the file, the node, and the
    rule; the command exits non-zero on any finding and offers JSON output
    beside the readable form so an authoring agent or a CI step can consume
    it.
  repository-agreements: >
    Directory validation loads the complete recursive blueprint inventory before
    resolving child-run targets. File-local schema checks remain independent.
    Findings use repository.child-missing for unresolved targets,
    repository.child-duplicate for ambiguous targets, repository.child-kind for
    incompatible kinds, and repository.child-output-path for undeclared direct
    output paths. Messages identify the parent blueprint, node, target, and
    mapping. repository.output-schema reports invalid output declarations;
    repository.output-shape identifies a terminal value that contradicts its
    output declaration. repository.child-output-shape links that contradiction
    back to each affected parent result mapping.
    Output schemas are the static authority. Literal terminal values are checked
    with JSON Schema. Direct references to declared inputs, pass envelopes, and
    aggregate bindings provide conservative shape checks. An optional property
    or union member is a legal mapped path even when another terminal outcome
    omits it. General JSONata expressions remain legal; expression evaluation,
    arbitrary schema implication, and conditional reachability are not claimed
    as static proofs. No run or external effect starts during these checks.
  command-line: >
    `heddle validate <file or directory>` runs the chain above.
    `heddle skill list` names the embedded skills and `heddle skill export
    <name> <dir>` expands one into a folder an agent harness can load. The
    blueprint authoring skill is one of them. The command surface is
    specified as a command-line-interface specification when the CLI is
    built.
  pinning-and-change: >
    The service reads the blueprint repository at a commit. A run pins that
    commit, which covers the blueprint and every file it references. A new
    commit changes what new instances get; running instances keep their
    commit until they finish. Moving a running instance to a newer commit
    is not supported in this version.
  authoring-help: >
    An author reference is generated from the node-type contracts: every
    node type, its inputs with defaults, its outputs, its results, the
    context keys it writes, and the lint rules. The blueprint authoring
    skill is generated from the same contracts and embedded in the CLI, so
    the skill, the reference, and the code cannot disagree. The skill tells
    an agent to run `validate` after every edit and to read its JSON output,
    so the authoring loop needs no person in it. A console editor, later,
    reads the same reference.
  fixtures: >
    The repository ships fixture blueprints: the user's real lifecycle, and
    blueprints that deliberately do things the design did not anticipate, to
    prove the flexibility claim. Fixtures are run in tests against stubbed
    node types and are the proof of work for the catalog.
