$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: engine-and-run-model
description: >-
  Defines Heddle's executable command surface and the production service
  boundary. `heddle start` owns one durable store writer and composes the
  engine, scheduler, GitHub intake and webhook delivery, generated tools,
  harness hook transport, notification delivery, and T3 Code pass runtime.
format: cli
validation-criteria: >-
  CLI, configuration, packaged-process, recovery, signal, exclusive-writer,
  and Dev Container Feature tests execute the same production composition.
commands:
  start:
    invocation: heddle start
    description: Run one long-lived Heddle service until SIGINT or SIGTERM.
    options:
      config:
        syntax: --config <path>
        default: ~/.config/heddle/config.yml
      state-directory:
        syntax: --state <directory>
        default: ~/.local/state/heddle/
      database:
        syntax: --database <path>
        default: <state-directory>/heddle.sqlite
      polling-interval:
        syntax: --poll-interval <milliseconds>
        default: 30000
      github-app-credentials:
        syntax: --github-app-credentials <path>
      t3-token:
        syntax: --t3-token <path>
      webhook-secret:
        syntax: --webhook-secret <path>
    exit-status:
      success: 0 after SIGINT or SIGTERM closes intake, listeners, the T3 Code client, and SQLite
      usage-error: 2 for an unknown option, a missing or flag-shaped value, a duplicate singleton option, or an invalid polling interval
      configuration-error: 1 with the resolved configuration path and actionable detail
      ownership-error: 1 when another live Heddle service owns the configured database
configuration:
  projects: Bound GitHub Project owner and number pairs. An empty list runs an idle service.
  github.credentialFile: GitHub App credential-file path.
  blueprints.repository: Local blueprint repository root.
  t3Code.endpoint: T3 Code service URL.
  t3Code.tokenFile: Optional bearer-token file path.
  webhook.secretFile: Optional GitHub webhook secret-file path.
  state.databasePath: Optional SQLite database path override.
  polling.intervalMs: Optional positive polling interval in milliseconds; default 30000.
  intake: Optional default intake blueprint id and pinned commit.
  pass: Required for bound projects; supplies the default model and worktree.
  notifications.pushoverCredentialFile: Optional JSON file containing Pushover token and user fields.
diagnostics:
  startup: Reports the resolved database path and polling interval without secret values.
  errors: Report paths and operational causes without credential contents.
signals:
  SIGINT: Stop new intake, close resources and SQLite, release the writer, then exit successfully.
  SIGTERM: Stop new intake, close resources and SQLite, release the writer, then exit successfully.
ownership: >-
  Writer ownership uses an operating-system descriptor lock on
  <canonical-database-path>.writer before opening SQLite. The anchor remains
  on disk; closing the descriptor or process death releases ownership.
  Database symlinks resolve to the same owner. State-directory and database
  overrides are independent; different databases can share one state directory.
hook-transport: >-
  Each database has a hook socket under the state directory named
  hooks-<identity>.sock, where identity is the first 24 hexadecimal characters
  of SHA-256 of the canonical database path. Startup reports the exact socket.
  Hook commands use HEDDLE_HOOK_SOCKET when set. Otherwise they derive the
  socket from heddle.sqlite under HEDDLE_STATE_DIR or the default state
  directory. Set HEDDLE_HOOK_SOCKET to the reported socket for a database
  override.
recovery: >-
  Startup recovers durable engine runs and pass observations before accepting
  webhook, generated-tool, or hook traffic or new intake. The HTTP listener
  returns 503 without dispatching requests throughout engine and pass recovery.
  The hook listener starts after recovery. A forced process death leaves the
  SQLite checkpoint intact; the next service acquires ownership, opens the
  same database, and resumes the paused run.
