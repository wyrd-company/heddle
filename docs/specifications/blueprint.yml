$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - blueprint-authoring
    - node-types
description: >-
  Defines the blueprint file: the YAML document a person or agent authors to
  describe how work moves through a process, and which Heddle loads, lints,
  and runs on the Flowcraft engine. A blueprint has an id, a kind (process,
  stage, or helper), a metadata bag, what it requires from the issue and
  the project, nodes keyed by id, and edges that route on expressions. Each
  node names a node type, carries a metadata bag that becomes part of that
  node's context, and gives the node type its inputs under `params`.
  Prompts are Nunjucks templates rendered with the task context. Handoff
  schemas are JSON Schema written in YAML and are exposed verbatim as the
  handoff tool's input schema, so they must satisfy the MCP tool input
  schema constraints. Blueprints never carry action edges and never use
  the Flowcraft subflow node type; composition is through `child-run`. Intake uses `lifecycle-start` to create
  an independent process run with the same issue snapshot and pinned commit.
  Its blueprint id and additional input mapping may reference policy output;
  the issue is transferred automatically and cannot be replaced by inputs.
  The synchronous started result carries payload.runId without waiting for
  lifecycle completion.
  A graph in which every node has an incoming edge declares the node where
  execution begins with `entry`. `docs/specifications/blueprint.schema.yml`
  is the machine-readable blueprint definition. Policy nodes reference an
  ordered policy rule artifact beside the blueprint. Each rule has a stable
  id, an optional JSONata condition, a selected blueprint, and optional input
  bindings. Rule ids are unique, and a rule without a condition is the final
  fallback.
format: json-schema
validation-criteria: >-
  A conforming blueprint file parses as YAML 1.2 into a document that
  validates against `docs/specifications/blueprint.schema.yml` interpreted as
  JSON Schema Draft 2020-12. Node ids are the keys of `nodes` and are
  slugs. `entry`, when present, names an existing node; it is required when
  the graph has no natural entry node. Every edge names two existing node ids.
  Every `when` expression is a syntactically valid JSONata expression. Every path in a
  `templateRef`, `schemaRef`, or `policy.rules` resolves to a file beside the
  blueprint. A referenced policy rules file validates against
  `docs/specifications/policy-rule.schema.yml` interpreted as JSON Schema
  Draft 2020-12. Input bindings are literal values or `{ from: <expression> }`
  references evaluated over the policy input. Rule ids are unique within the
  artifact, and no rule follows a condition-less fallback. Every `handoff`
  schema is itself a valid JSON Schema Draft
  2020-12 object whose root is `type: object` with `properties` and a
  non-empty `description`, since it is exposed verbatim as the MCP tool. Node
  `params` additionally validate against the named node type's published
  contract, which is generated from code and is authoritative for keys this
  schema leaves open. Derived Flowcraft blueprints pass Flowcraft's linter
  and Heddle's lint rules: no `subflow`, no edge `action`, every result of a
  pausing node handled by an outgoing edge, every `question` role served by
  a configured channel, every stage name a valid single-select option, and
  `requires.issue` satisfiable against the bound project at reconciliation.
  Stage-name and `requires.issue` project checks run only when live validation
  is requested; without a live implementation they return named `not checked`
  findings rather than silently passing.
  Loading a file and saving it unchanged produces byte-identical output,
  comments included. Fixture blueprints under `fixtures/blueprints/` are the
  conformance corpus and each must pass every check above.
